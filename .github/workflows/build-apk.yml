name: Build CyberBot Deriv APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apache Cordova
        run: npm install -g cordova

      - name: Create Cordova Android Project
        run: |
          cordova create cyberbot_app com.hassan.cyberbotderiv "CyberBot Deriv Pro"
          cp index.html cyberbot_app/www/index.html
          cd cyberbot_app
          cordova platform add android
          cordova build android

      - name: Rename APK
        run: |
          cp cyberbot_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk CyberBot-Deriv-Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberBot-Deriv-Pro-APK
          path: CyberBot-Deriv-Pro.apk
