  <style>
    :root {
      --bg-deep: #03060f;
      --bg-card: rgba(10, 17, 35, 0.92);
      --bg-glass: rgba(16, 28, 56, 0.78);
      --cyan: #00f0ff;
      --blue: #2979ff;
      --purple: #8b5cf6;
      --green: #00e676;
      --red: #ff3b5c;
      --gold: #ffcc00;
      --text: #f8fafc;
      --muted: #8fa2c7;
      --border: rgba(0, 240, 255, 0.28);
      --shadow-glow: 0 0 28px rgba(0, 240, 255, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 12% 14%, rgba(0, 240, 255, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 88% 20%, rgba(139, 92, 246, 0.18) 0%, transparent 48%),
        radial-gradient(circle at 50% 90%, rgba(41, 121, 255, 0.14) 0%, transparent 55%),
        linear-gradient(180deg, rgba(3, 6, 15, 0.88) 0%, rgba(3, 6, 15, 0.97) 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== شاشة الدخول القوية ========== */
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: radial-gradient(circle at top, #0d1d42 0%, #03060f 85%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    .auth-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 28px 24px;
      box-shadow: var(--shadow-glow);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .robot-orb {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 2.5px solid var(--cyan);
      background: radial-gradient(circle at 40% 35%, rgba(0, 240, 255, 0.35), #060c1d 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 36px rgba(0, 240, 255, 0.45);
      position: relative;
      overflow: hidden;
    }

    .robot-orb::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 1px solid rgba(0, 240, 255, 0.15);
      animation: pulseRing 2.8s ease-in-out infinite;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 0.2; }
    }

    .auth-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .auth-title span { color: var(--cyan); }

      font-size: 12.5px;
      color: var(--muted);
      margin: 8px 0 20px;
      line-height: 1.65;
    }
